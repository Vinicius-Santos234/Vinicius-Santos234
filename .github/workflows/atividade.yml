name: atualizar atividade

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 09:17 UTC (06:17 em Brasilia)
  workflow_dispatch:        # botao "Run workflow" na aba Actions
  push:
    branches: [main]
    paths:
      - "scripts/readme/**"
      - ".github/workflows/atividade.yml"

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar fontTools (recorta a fonte embutida no SVG)
        run: pip install fonttools==4.63.0

      - name: Gerar tema/atividade.svg
        env:
          # O total e o mesmo do grafico do perfil, que conta tambem os privados.
          # Se o GITHUB_TOKEN padrao nao enxergar isso, crie o secret GH_STATS_TOKEN
          # (PAT com escopo read:user) e ele passa a ser usado no lugar.
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/readme/gerar_atividade.py ${{ github.repository_owner }} tema/atividade.svg

      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tema/atividade.svg
          git diff --staged --quiet && echo "nada mudou" && exit 0
          git commit -m "chore: atualiza tema/atividade.svg"
          git push
