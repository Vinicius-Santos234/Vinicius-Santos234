name: atualizar stats

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 09:17 UTC (06:17 em Brasilia)
  workflow_dispatch:        # botao "Run workflow" na aba Actions
  push:
    branches: [main]
    paths:
      - "scripts/gerar-stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar stats.svg
        env:
          # Opcional: crie o secret GH_STATS_TOKEN (PAT com escopo read:user)
          # para incluir commits dos ultimos 12 meses e a sequencia de dias.
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/gerar-stats.py ${{ github.repository_owner }}

      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git diff --staged --quiet && echo "nada mudou" && exit 0
          git commit -m "chore: atualiza stats.svg"
          git push
